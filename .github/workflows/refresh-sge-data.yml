name: Refresh SGE public football data

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_sge_data.py"
      - ".github/workflows/refresh-sge-data.yml"

permissions:
  contents: write

concurrency:
  group: refresh-sge-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and normalize public data
        run: python scripts/update_sge_data.py
      - name: Commit snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/sge.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): refresh SGE football snapshot"
            # Other workflows may update main while the data is being fetched.
            # Rebase the generated snapshot on the newest main before pushing.
            for attempt in 1 2 3; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Could not push snapshot after 3 attempts."
                exit 1
              fi
              sleep 2
            done
          else
            echo "No data changes."
          fi
